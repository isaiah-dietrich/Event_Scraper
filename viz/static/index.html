<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Event Scraper</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #header {
      padding: 14px 20px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
    #status { font-size: 13px; color: #8b949e; }
    #status.running { color: #58a6ff; }
    #status.complete { color: #3fb950; }
    #cy { flex: 1; }
    #legend {
      padding: 10px 20px;
      border-top: 1px solid #21262d;
      display: flex;
      gap: 24px;
      font-size: 12px;
      color: #8b949e;
      flex-shrink: 0;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 3px;
      border: 1.5px solid transparent;
    }
  </style>
</head>
<body>

<div id="header">
  <h1>⚡ AI Event Scraper — Live Pipeline</h1>
  <span id="status">Waiting for run to start...</span>
</div>

<div id="cy"></div>

<div id="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background:#1c2128;border-color:#484f58"></div> Pending
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#1f3a5f;border-color:#1f6feb"></div> Running
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#1a3a2a;border-color:#238636"></div> Done
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:#3a1a1a;border-color:#da3633"></div> Failed
  </div>
</div>

<script>
// ── Layout constants ────────────────────────────────────────────────────────
const STEPS = ['fetch', 'reduce', 'extract', 'score', 'result'];
const STEP_LABELS = {
  fetch: 'Fetch',
  reduce: 'Reduce',
  extract: 'Extract',
  score: 'Score',
  result: 'Done',
};

const COL_X = { url: 100, fetch: 285, reduce: 470, extract: 655, score: 840, result: 1025 };
const ROW_H = 130;
const START_Y = 90;

// ── Cytoscape styles ────────────────────────────────────────────────────────
const NODE_STATE = {
  pending: { 'background-color': '#1c2128', 'border-color': '#484f58', 'color': '#8b949e' },
  running: { 'background-color': '#1f3a5f', 'border-color': '#1f6feb', 'color': '#58a6ff' },
  done:    { 'background-color': '#1a3a2a', 'border-color': '#238636', 'color': '#3fb950' },
  failed:  { 'background-color': '#3a1a1a', 'border-color': '#da3633', 'color': '#f85149' },
};

const cy = cytoscape({
  container: document.getElementById('cy'),
  style: [
    {
      selector: 'node',
      style: {
        'label': 'data(label)',
        'text-valign': 'center',
        'text-halign': 'center',
        'border-width': 2,
        'font-size': 11,
        'font-family': 'monospace',
        'width': 140,
        'height': 48,
        'shape': 'roundrectangle',
        'text-wrap': 'wrap',
        'text-max-width': 128,
        'transition-property': 'background-color, border-color, color',
        'transition-duration': '300ms',
        ...NODE_STATE.pending,
      },
    },
    {
      selector: 'node[type="url"]',
      style: {
        'width': 160,
        'font-size': 10,
        'background-color': '#1c2128',
        'border-color': '#484f58',
        'color': '#e6edf3',
        'text-wrap': 'wrap',
        'text-max-width': 148,
      },
    },
    {
      selector: 'edge',
      style: {
        'width': 1.5,
        'line-color': '#30363d',
        'target-arrow-color': '#30363d',
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        'arrow-scale': 0.7,
      },
    },
  ],
  layout: { name: 'preset' },
  userZoomingEnabled: true,
  userPanningEnabled: true,
  minZoom: 0.3,
  maxZoom: 2,
});

// ── State ───────────────────────────────────────────────────────────────────
const sites = {}; // url -> rowIndex
let totalSites = 0;
let doneSites = 0;

function nodeId(url, key) {
  // Use a stable numeric index to avoid special-char issues in IDs
  return `s${sites[url]}_${key}`;
}

function addSite(url) {
  const index = totalSites++;
  sites[url] = index;
  const y = START_Y + index * ROW_H;
  const shortUrl = url.replace(/^https?:\/\//, '').replace(/\/$/, '');

  const els = [];

  // URL (start) node
  els.push({
    data: { id: nodeId(url, 'url'), label: shortUrl, type: 'url' },
    position: { x: COL_X.url, y },
  });

  // Step nodes
  STEPS.forEach(step => {
    els.push({
      data: { id: nodeId(url, step), label: STEP_LABELS[step], type: 'step' },
      position: { x: COL_X[step], y },
    });
  });

  // Edges
  const allKeys = ['url', ...STEPS];
  for (let i = 0; i < allKeys.length - 1; i++) {
    els.push({
      data: {
        source: nodeId(url, allKeys[i]),
        target: nodeId(url, allKeys[i + 1]),
      },
    });
  }

  cy.add(els);
  cy.fit(cy.elements(), 60);
}

function setNodeState(url, step, state, label) {
  const node = cy.getElementById(nodeId(url, step));
  if (!node.length) return;
  node.style(NODE_STATE[state]);
  if (label !== undefined) node.data('label', label);
}

// ── SSE connection ───────────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
const es = new EventSource('/stream');

es.onmessage = ({ data }) => {
  const msg = JSON.parse(data);
  const { type, url, step, detail, error } = msg;

  switch (type) {
    case 'site_queued':
      addSite(url);
      statusEl.className = 'running';
      statusEl.textContent = `Running — ${doneSites}/${totalSites} complete`;
      break;

    case 'step_start':
      setNodeState(url, step, 'running');
      break;

    case 'step_done': {
      const label = detail
        ? `${STEP_LABELS[step]}\n${detail}`
        : STEP_LABELS[step];
      setNodeState(url, step, 'done', label);
      if (step === 'score' || step === 'extract') {
        // extract can terminate early (no events)
        if (step === 'score' || detail === '0 events') {
          setNodeState(url, 'result', 'done', '✓ Done');
          doneSites++;
          statusEl.textContent = `Running — ${doneSites}/${totalSites} complete`;
        }
      }
      break;
    }

    case 'step_failed':
      setNodeState(url, step, 'failed', `✗ ${STEP_LABELS[step]}`);
      setNodeState(url, 'result', 'failed', '✗ Failed');
      doneSites++;
      statusEl.textContent = `Running — ${doneSites}/${totalSites} complete`;
      break;

    case 'run_complete':
      statusEl.className = 'complete';
      statusEl.textContent = `✓ Complete — ${doneSites}/${totalSites} sites processed`;
      es.close();
      break;
  }
};

es.onerror = () => {
  if (totalSites > 0) {
    statusEl.textContent += ' (disconnected)';
  }
};
</script>
</body>
</html>

name: Weekly digest

on:
  schedule:
    # 9am Central every Monday, year round. GitHub Actions cron is fixed-UTC
    # and never shifts for daylight saving, so 9am local needs two entries:
    # 15:00 UTC while Central is on CST (UTC-6, roughly Nov-Mar) and 14:00
    # UTC while it's on CDT (UTC-5, roughly Mar-Nov). Both fire every Monday;
    # the "gate" job below stops whichever one is wrong for the current half
    # of the year before the pipeline (and its API spend) ever starts.
    - cron: "0 15 * * 1"
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  # Decides which of the two schedules above is the 9am-Central one today.
  # Cheap enough to be worth burning a runner on: it does no checkout, no
  # installs, and no API calls, so the discarded half of the schedules costs
  # only a few seconds of runner time.
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          # Empty for workflow_dispatch; the triggering cron string otherwise.
          FIRED_BY: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Manual trigger - running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # -0500 means Central is on CDT right now, -0600 means CST. This is
          # evaluated on the Monday the cron fires and DST always flips on a
          # Sunday, so it can't change out from under the run.
          if [ "$(TZ=America/Chicago date +%z)" = "-0500" ]; then
            want="0 14 * * 1"
          else
            want="0 15 * * 1"
          fi
          if [ "$FIRED_BY" = "$want" ]; then
            echo "Fired by '$FIRED_BY', which is 9am Central today - running."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fired by '$FIRED_BY', but 9am Central today is '$want' - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  weekly-digest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # events_master.xlsx and token_usage_history.json are gitignored on
      # main - they're the pipeline's dedupe store and usage log, persisted
      # instead on the separate "state" branch (see cli/batch.py MASTER_PATH
      # and TOKEN_USAGE_HISTORY_PATH, both plain relative paths). Restoring
      # them into place before the run is what lets a fresh checkout dedupe
      # correctly against every event a previous run has already reported.
      - name: Restore state
        run: |
          cp state-branch/events_master.xlsx . 2>/dev/null || true
          cp state-branch/token_usage_history.json . 2>/dev/null || true

      - name: Run weekly digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT_EMAIL: ${{ secrets.DIGEST_RECIPIENT_EMAIL }}
          DIGEST_RECIPIENT_NAME: ${{ secrets.DIGEST_RECIPIENT_NAME }}
          DIGEST_CC_EMAIL: ${{ secrets.DIGEST_CC_EMAIL }}
        run: python run.py

      # Uploaded regardless of the run's outcome so a failed email send
      # still leaves the digest recoverable for a manual resend, mirroring
      # the local "resend from the file saved on disk" recovery path (see
      # README.md's Failure handling section).
      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest
          path: weekly_digests/*.xlsx
          if-no-files-found: ignore

      # Runs even if the run above failed. On a HEALTHY run, cli/batch.py's
      # main() updates the master workbook BEFORE attempting to send, so a
      # failed send never leaves that run's newly-seen events unrecorded -
      # otherwise the next run would treat them as new again. On a GATED run
      # (see utility/run_health.py) main() deliberately does NOT write the
      # master, because those events were reported to nobody; this step then
      # copies back a byte-identical file and the `git diff --cached --quiet`
      # below turns the commit into a no-op, which is the intended outcome.
      #
      # Each file is copied separately and tolerantly, mirroring the Restore
      # step: a run that is gated before ever writing the master (a first-ever
      # run, or one following a rollback) legitimately has no file to copy,
      # and a hard `cp` of both at once would fail the step over it.
      - name: Persist state back to the state branch
        if: always()
        run: |
          cp events_master.xlsx state-branch/ 2>/dev/null || true
          cp token_usage_history.json state-branch/ 2>/dev/null || true
          cd state-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events_master.xlsx token_usage_history.json
          git diff --cached --quiet || git commit -m "Update state - $(date -u +%Y-%m-%d)"
          git push origin state
